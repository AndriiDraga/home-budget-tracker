name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  django-tests:
    name: Django tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: budget_tracker_ci
          POSTGRES_USER: budget_tracker
          POSTGRES_PASSWORD: budget_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budget_tracker -d budget_tracker_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: budget_tracker.settings.testing
      SECRET_KEY: django-ci-secret-key
      USE_POSTGRES_FOR_TESTS: "1"
      POSTGRES_DB: budget_tracker_ci
      POSTGRES_USER: budget_tracker
      POSTGRES_PASSWORD: budget_tracker
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_DB_PORT: 5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run tests with coverage
        run: coverage run manage.py test finance.tests

      - name: Coverage report
        run: coverage report -m --fail-under=90
