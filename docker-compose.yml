services:
  db:
    image: postgres:16-alpine
    env_file: .env.docker
    volumes:
      - budget_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget_tracker -d budget_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file: .env.docker
    environment:
      DJANGO_SETTINGS_MODULE: budget_tracker.settings.docker
      POSTGRES_HOST: db
      POSTGRES_DB_PORT: "5432"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn budget_tracker.wsgi:application --bind 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  budget_pgdata:
