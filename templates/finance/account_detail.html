{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">{{ account.name }}</h2>
    <div>
        {% if is_account_owner %}
        <a href="{% url 'finance:account-invite' account.pk %}" class="btn btn-outline-primary">Invite</a>
        <a href="{% url 'finance:account-members' account.pk %}" class="btn btn-outline-secondary">Members</a>
        <a href="{% url 'finance:account-update' account.pk %}" class="btn btn-outline-secondary">Edit</a>
        <a href="{% url 'finance:account-delete' account.pk %}" class="btn btn-outline-danger">Delete</a>
        {% endif %}
    </div>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <p><strong>Type:</strong> {{ account.account_type }}</p>
        <p class="mb-0"><strong>Balance:</strong> {{ account.balance }}</p>
    </div>
</div>
{% endblock %}
