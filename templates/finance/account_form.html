{% extends "base.html" %}
{% block content %}
<h2 class="mb-4">{% if object %}Edit{% else %}New{% endif %} Account</h2>

<div class="card shadow-sm" style="max-width: 480px;">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                {{ field.errors }}
                <div class="border rounded p-1">
                    {{ field }}
                </div>
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'finance:account-list' %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
