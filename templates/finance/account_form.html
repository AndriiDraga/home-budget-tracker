{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<h2 class="mb-4">{% if object %}Edit{% else %}New{% endif %} Category</h2>

<div class="card shadow-sm" style="max-width: 480px;">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'finance:category-list' %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
