{% extends "base.html" %}
{% block content %}
<h2 class="mb-3">My invitations</h2>

<div class="card shadow-sm">
    <table class="table table-hover mb-0 align-middle">
        <thead class="table-light">
            <tr>
                <th>Account</th>
                <th>Invited by</th>
                <th class="text-end">Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for invitation in invitations %}
            <tr>
                <td>{{ invitation.account.name }}</td>
                <td>{{ invitation.invited_by.username }}</td>
                <td class="text-end">
                    <form method="post" action="{% url 'finance:invitation-accept' invitation.pk %}" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-sm btn-primary">Accept</button>
                    </form>
                    <form method="post" action="{% url 'finance:invitation-reject' invitation.pk %}" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-sm btn-outline-secondary">Reject</button>
                    </form>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="3" class="text-center text-muted py-4">No pending invitations.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
