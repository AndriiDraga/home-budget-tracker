{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h2 class="mb-4">Invite to {{ account.name }}</h2>
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary">Send invite</button>
            <a href="{% url 'finance:account-detail' account.pk %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
